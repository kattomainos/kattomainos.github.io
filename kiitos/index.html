<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiitos yhteydenotosta | Kattomainos</title>

  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Sora', sans-serif;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">

  <section class="min-h-screen flex items-center justify-center px-6">

    <div class="max-w-2xl text-center">

      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-blue-50 mb-8">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="w-10 h-10 text-[#0058BE]"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"/>
        </svg>
      </div>

      <p class="text-[#0058BE] font-semibold tracking-wide uppercase mb-4">
        Viesti vastaanotettu
      </p>

      <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6">
        Kiitos yhteydenotosta.
      </h1>

      <p class="text-xl text-slate-600 leading-relaxed mb-10">
        Viestisi on lähetetty onnistuneesti. Otamme yhteyttä mahdollisimman pian.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center">

        <a href="/"
           class="bg-black text-white px-8 py-4 rounded-full font-semibold hover:opacity-90 transition">
          Takaisin etusivulle
        </a>

        <a href="/taloyhtioille/"
           class="border border-slate-300 px-8 py-4 rounded-full font-semibold hover:bg-white transition">
          Taloyhtiöille
        </a>

      </div>

    </div>

  </section>

</body>
</html>
